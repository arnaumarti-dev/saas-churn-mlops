name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard JavaScript syntax
        run: |
          node --check src/churn_mlops/api/static/demo.js
          node --check src/churn_mlops/api/private_assets/console.js
          node --check src/churn_mlops/api/static/dashboard-utils.js
          node --test tests/test_dashboard_utils.cjs
          node --test tests/test_ui_behavior.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=src pytest -q

  end-to-end:
    name: Train model and test real API prediction
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download IBM Telco dataset
        run: python scripts/download_data.py
      - name: Train and evaluate models
        run: PYTHONPATH=src python scripts/train_model.py
      - name: Smoke test model artifact through FastAPI
        run: PYTHONPATH=src python scripts/smoke_test.py
      - name: Verify evaluation artifacts
        run: |
          test -s models/best_model.joblib
          test -n "$(find artifacts -name '*_test_metrics.json' -size +0c -print -quit)"
      - name: Upload evaluation metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-metrics
          path: artifacts/*_metrics.json
          if-no-files-found: warn

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inference image
        run: docker build --tag saas-churn-mlops:ci .

  deployable-demo:
    name: Build and smoke-test deployable demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate local-only OIDC compose wiring (no deployment)
        run: docker compose --env-file .env.staging.example -f compose.private-staging.yml config --quiet
      - name: Build self-contained demo image
        run: docker build -f Dockerfile.demo -t churn-demo:ci .
      - name: Start demo container
        run: docker run --rm -d --name churn-demo -p 8000:8000 churn-demo:ci
      - name: Verify dashboard and real prediction over HTTP
        run: python scripts/check_demo_http.py
      - name: Inspect container logs on failure
        if: failure()
        run: docker logs churn-demo || true
      - name: Stop demo container
        if: always()
        run: docker stop churn-demo || true
