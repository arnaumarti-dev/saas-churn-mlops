name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit direct and transitive Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vulnerability auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.serve.txt
      - name: Audit training and development dependencies
        run: pip-audit -r requirements.txt
      - name: Audit opt-in SaaS integration dependencies
        run: pip-audit -r requirements.saas.txt
